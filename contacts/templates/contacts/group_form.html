<h1>Create Group</h1>
<form method="POST">
  {% csrf_token %}
  <label>Group Name:</label>
  <input type="text" name="name" required /><br />
  <button type="submit">Create</button>
</form>

<a href="{% url 'contact_create' %}">Back to Contact</a>

{% if messages %}
<ul class="messages">
  {% for message in messages %}
  <li>{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}
